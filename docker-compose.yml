services:

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
      args:
        NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
    image: ai-customer-platform:latest
    container_name: ai-customer-platform
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-bizai-demo-secret-key-2024}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      AUTH_TRUST_HOST: "true"
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: "0.0.0.0"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/ 2>&1 | grep -q html && exit 0 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  app-dev:
    profiles:
      - dev
    build:
      context: .
      dockerfile: Dockerfile
      target: deps
    image: ai-customer-platform:dev
    container_name: ai-customer-platform-dev
    working_dir: /app
    command: sh -c "npm run dev"
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - ./src:/app/src
      - ./public:/app/public
      - ./next.config.ts:/app/next.config.ts
      - ./tsconfig.json:/app/tsconfig.json
      - ./postcss.config.mjs:/app/postcss.config.mjs
      - ./eslint.config.mjs:/app/eslint.config.mjs
      - nextjs_dev_cache:/app/.next
    environment:
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-bizai-demo-secret-key-2024}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      AUTH_TRUST_HOST: "true"
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      NODE_ENV: development
      PORT: 3000
      HOSTNAME: "0.0.0.0"

volumes:
  nextjs_dev_cache:
    driver: local